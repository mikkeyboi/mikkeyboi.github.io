name: Publish Quarto site to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests build the whole site (no deploy) so a change is verified before it ships.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      # Uncomment if posts use Python execution (matplotlib, etc.)
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.11"
      # - name: Install Python deps
      #   run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: living-cv/package-lock.json

      # The living CV is the home page. Its Rust kernels are pre-compiled and embedded
      # (living-cv/src/kernel/kernel.wasm.ts), so this step needs no Rust toolchain.
      - name: Build living CV
        working-directory: living-cv
        run: |
          npm ci
          npm run build

      - name: Render site
        run: quarto render

      - name: Assemble site
        run: |
          cp -R living-cv/dist/. _site/
          # Keep the old feed URL working for existing subscribers.
          cp _site/writing.xml _site/index.xml
          test -f _site/index.html
          test -f _site/posts/05-h005-refusal-direction/index.html
          test -f _site/playground/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
