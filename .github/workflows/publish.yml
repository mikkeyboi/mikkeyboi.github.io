name: Build and publish site

# Rust kernels -> Astro site (living CV) -> Quarto posts -> one site. Pull requests run every check and build
# the whole site without deploying; pushes to main also deploy to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust kernels (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site/rust
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: cv-kernel-wasm
          path: site/rust/target/wasm32-unknown-unknown/release/cv_kernel.wasm

  web:
    name: Astro site (astro check, lint, tests, build)
    needs: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: cv-kernel-wasm
          path: site/wasm
      # The site always ships the kernel compiled from this commit's Rust source.
      - run: node scripts/embed-wasm.mjs wasm/cv_kernel.wasm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist

  site:
    name: Site (Quarto render, assemble)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"
      - run: quarto render
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - name: Assemble
        run: |
          cp -R site-dist/. _site/
          test -f _site/index.html
          test -f _site/writing.html
          # Every post keeps its /posts/NN-slug/ URL.
          for d in posts/*/; do test -f "_site/${d}index.html"; done
          test -f _site/playground/index.html
          test -f _site/playground/widgets/refusal_sim.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
