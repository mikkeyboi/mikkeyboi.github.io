project:
  type: website
  output-dir: _site
  # The living CV (living-cv/) is a separate Vite build copied into _site by the workflow.
  render:
    - "*.qmd"
    - "!living-cv/"
  resources:
    - playground/widgets/*.mjs
    - fonts/*

website:
  title: "Michael Leung"
  description: "ML engineering, post-training, and notes from a neuroscientist-turned-modeller."
  site-url: "https://minwahleung.ca"
  repo-url: "https://github.com/mikkeyboi/mikkeyboi.github.io"
  repo-actions: [edit, issue]
  open-graph: true
  twitter-card:
    creator: "@mikkeyboi"
    card-style: summary_large_image
  navbar:
    pinned: true
    left:
      - href: writing.qmd
        text: Writing
      - href: playground/index.qmd
        text: Playground
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/mikkeyboi
        aria-label: GitHub
  page-footer:
    border: false
    left: "© 2026 Michael Leung"
    center: "[Living CV](/) · [Writing](/writing.html) · [Playground](/playground/) · [About](/about.html)"
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    # Dark first, so it is the default and matches the living CV; light stays one toggle away.
    theme:
      dark: [cosmo, theme-dark.scss]
      light: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-align: center
    fig-cap-location: bottom
    link-external-newwindow: true
    include-in-header:
      - _includes/posthog.html

execute:
  freeze: auto
